name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: "Lint & Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
      - name: "Set up Node"
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: "Install dependencies"
        run: npm ci
      - name: "Sync Astro types"
        run: npx astro sync
      - name: "Type check"
        run: npm run check
      - name: "Lint"
        run: npm run lint
      - name: "Security: raw SQL check"
        run: node scripts/check-no-raw-sql.mjs
      - name: "Security: dependency audit"
        run: npx audit-ci --config audit-ci.jsonc
      - name: "Test"
        run: npm run test
      - name: "Build"
        run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  e2e:
    name: "E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
      - name: "Set up Node"
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: "Install dependencies"
        run: npm ci
      - name: "Set up Supabase CLI"
        uses: supabase/setup-cli@v3
      - name: "Start local Supabase stack"
        run: >
          npx supabase start
          --exclude studio,imgproxy,logflare,vector,edge-runtime,realtime,storage-api,mailpit,postgres-meta,supavisor
      - name: "Reset database"
        run: npx supabase db reset
      - name: "Export Supabase connection info"
        # supabase status -o env prints shell-quoted KEY="value" lines (meant for `eval`);
        # GITHUB_ENV takes the value literally, so the quote characters must be stripped
        # first or they end up embedded in SUPABASE_URL/SUPABASE_KEY themselves.
        run: >
          npx supabase status -o env
          --override-name api.url=SUPABASE_URL
          --override-name auth.anon_key=SUPABASE_KEY
          | sed 's/"//g' >> "$GITHUB_ENV"
      - name: "Install Playwright browsers"
        run: npx playwright install --with-deps chromium
      - name: "Run e2e tests"
        run: npm run test:e2e
      - name: "Upload Playwright report"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  deploy:
    name: "Deploy to Cloudflare Workers"
    needs: ci
    # Disabled: auto-deploy on push to main is handled by Cloudflare Workers Builds (native Git
    # integration, see context/changes/deployment/deployment-plan.md "Cloudflare Workers Builds"
    # section), not GitHub Actions. This job is kept as a documented fallback alternative.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
      - name: "Set up Node"
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: "Install dependencies"
        run: npm ci
      - name: "Build"
        run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - name: "Deploy"
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            SUPABASE_URL
            SUPABASE_KEY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
