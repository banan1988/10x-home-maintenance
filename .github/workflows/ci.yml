name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: "Lint & Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
      - name: "Set up Node"
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: "Install dependencies"
        run: npm ci
      - name: "Sync Astro types"
        run: npx astro sync
      - name: "Lint"
        run: npm run lint
      - name: "Test"
        run: npm run test
      - name: "Build"
        run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  deploy:
    name: "Deploy to Cloudflare Workers"
    needs: ci
    # Disabled: auto-deploy on push to main is handled by Cloudflare Workers Builds (native Git
    # integration, see context/changes/deployment/deployment-plan.md "Cloudflare Workers Builds"
    # section), not GitHub Actions. This job is kept as a documented fallback alternative.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
      - name: "Set up Node"
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: "Install dependencies"
        run: npm ci
      - name: "Build"
        run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - name: "Deploy"
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            SUPABASE_URL
            SUPABASE_KEY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
